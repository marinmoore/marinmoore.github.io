# The FBI Hate Crimes Dataset

This dataset includes all hate crimes reported to the FBI from 1991 to 2024.

--

Features include:
- Geographic data (city, state, region)
- Offender data (count, age, race, ethnicity)
- Victim data (count, age, race, ethnicity)
- Incident data (offense type, bias type)

--

For EDA, only data from the years 2015 to 2024 is used to ensure data relevance. For correlation and regression analysis, only data from 2024 is used to evaluate contemporary influencing factors rather than changes over time.

# Secondary Data Sources

- U.S. Census Bureau: state population, population density, % of population in poverty, median household income, and Diversity Index.

--

- U.S. Department of Justice: number of bias types covered by each state's hate crime laws.

--

- World Population Review: state Political Voting Index (PVI).

--

- Human Rights Campaign: State Equality Index (SEI).

--

- Movement Advancement Project: state LGBTQ+ hate crime law protections.

--

- American Civil Liberties Union: state-level anti-LGBTQ+ bills introduced.

---

# Conclusions from the Correlation Analysis

States with a more Democratic-leaning PVI, states with higher LGBTQ+ legal equality, and states with stronger hate crime protections report higher numbers of hate crimes per 100,000 residents. 

This is likely because such states tend to have more robust hate crime reporting procedures than Republican-leaning states with low LGBTQ+ equality and hate crime protections.

# Results &amp; Interpretations

Across these models, higher hate crime reports per 100,000 residents are generally associated with: 
- Higher population density 
- Higher median household income 
- Higher percent in poverty 
- Lower diversity index (less racial/ethnic diversity) 
- Lower hate crime law bias coverage

--

These relationships suggest potential methods for addressing hate crimes, including lowering poverty rates and increasing the biases covered by hate crime laws. 

---
class: small-text
# Implications

Stakeholders in this research include LGBTQ+ Americans, legislators and policymakers, law enforcement, lawyers and activist organizations. Additionally, all American citizens are impacted by these incidents because the proliferation of hate-motivated crimes threatens individual/group safety and national unity. This issue affects everyone.

--

Understanding the factors which correlate with anti-LGBTQ+ hate crimes is necessary for implementing effective preventative and protective measures. Without this understanding, the rate of these incidents will continue to rise.

--

Based on this research, such preventative measures may include:
-	Improving reporting procedures and mandating reporting of hate crimes to the FBI
-	Decreasing poverty rates
-	Increasing the coverage of hate crime laws
- Building compassion by learning with and about people of different religions, races, sexualities, opinions, and more
